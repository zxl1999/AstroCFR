[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpdc-astronomy"
version = "1.6.2"
description = "AstroCFR: deployable candidate generation, domain adaptation, and crowded-field recovery for astronomical images"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Xinlong Zhang"}]
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "astropy==7.2.0",
  "photutils==3.0.0",
  "sep==1.4.1",
  "scikit-learn==1.9.0",
  "matplotlib==3.9.2",
  "psutil==7.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
